<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Palabras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">   
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary-subtle text-primary-emphasis text-center py-3 border-0">
                        <h4 class="mb-0"><i class="fa-solid fa-ghost"></i> Buscador de Palabras</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="input-group mb-4">
                            <span class="input-group-text bg-success-subtle text-success-emphasis border-success-subtle">Palabra a buscar:</span>
                            <input type="text" id="texto" class="form-control border-secondary" placeholder="Pon tu palabra">
                        </div>

                        <div class="input-group mb-4">
                            <span class="input-group-text bg-success-subtle text-success-emphasis border-success-subtle">Texto a evaluar:</span>
                            <textarea class="form-control border-secondary" id="textoEvaluar" rows="4" placeholder="Ingresa el texto aquí"></textarea>
                        </div>

                        <div class="input-group mb-4">
                            <span class="input-group-text bg-success-subtle text-success-emphasis border-success-subtle">Palabra reemplazada:</span>
                            <input type="text" id="reemplazo" class="form-control border-secondary" placeholder="Pon tu palabra">
                        </div>

                        <div class="d-flex justify-content-center gap-3 mb-4">
                            <button class="btn bg-info-subtle text-info-emphasis border-info-subtle px-4 fw-medium" id="btn-procesar">Buscar  <i class="fa-solid fa-magnifying-glass"></i></button>
                            <button class="btn bg-danger-subtle text-danger-emphasis border-danger-subtle px-4 fw-medium" id="btn-limpiar">Limpiar  <i class="fa-solid fa-eraser"></i></button>
                            <button class="btn bg-info-subtle text-info-emphasis border-info-subtle px-4 fw-medium" id="btn-remplazar">Remplazar  <i class="fa-solid fa-repeat"></i></button>
                        </div>

                        <div id="seccion-resultados" style="display: none">
                            <div class="alert alert-info">
                                <strong>Número de veces que aparece:</strong> <span id="conteo-palabras" class="badge bg-primary fs-6">0</span>
                            </div>
                            <h5 class="mt-3">Coincidencias:</h5>
                            <div class="border p-3 rounded bg-white shadow-sm" id="texto-procesado" style="min-height: 100px"></div>
                            <h5 class="mt-3">Texto remplazado:</h5>
                            <div class="border p-3 rounded bg-white shadow-sm" id="texto-remplazado" style="min-height: 100px"></div>
                        </div>



                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="bundle.js"></script>
</body>
</html>
